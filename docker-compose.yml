version: '3.8'

services:
  discord-bot:
    build: .
    container_name: nsta-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=${MODEL_NAME}
      - MAX_HISTORY=${MAX_HISTORY}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
    env_file:
      - .env